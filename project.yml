name: RS485Tool
options:
  bundleIdPrefix: com.cfmoto
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  RS485Tool:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
        excludes:
          - "README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cfmoto.rs485tool
        PRODUCT_NAME: RS485Tool
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "485诊断"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "需要蓝牙连接 I6328A 485 透传模块"
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "需要蓝牙连接 I6328A 485 透传模块"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
