name: build-apk

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      - name: Accept Android licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Build APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: CFMOTO 485 诊断工具 APK
          body: |
            安卓 APK（debug 密钥签名，直接安装）。
            - 配合 I6328A 485 蓝牙模块使用
            - 构建提交：${{ github.sha }}
          files: android/app/build/outputs/apk/release/*.apk
          overwrite: true
          make_latest: true