name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (simulator, no signing)
        run: |
          xcodebuild \
            -project RS485Tool.xcodeproj \
            -scheme RS485Tool \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "RS485Tool.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP_PATH" ]; then
            # 回退：用模拟器产物打包（仅示意，模拟器产物不能装真机）
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "RS485Tool.app" -path "*Release-iphonesimulator*" | head -1)
          fi
          echo "APP_PATH=$APP_PATH"
          cp -R "$APP_PATH" Payload/ 2>/dev/null || true
          zip -r RS485Tool-unsigned.ipa Payload || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RS485Tool-unsigned-ipa
          path: RS485Tool-unsigned.ipa
          if-no-files-found: warn

      - name: Build check (device, no signing)
        run: |
          xcodebuild \
            -project RS485Tool.xcodeproj \
            -scheme RS485Tool \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
