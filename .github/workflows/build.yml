name: build-ipa

on:
  push:
    branches: [ main ]
    paths:
      - "*.swift"
      - "project.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rs485
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project and build
        run: |
          set -eo pipefail
          xcodegen generate
          xcodebuild -project RS485Tool.xcodeproj -scheme RS485Tool -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build 2>&1 | tee xcodebuild.log

      - name: Package IPA
        run: |
          set -e
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RS485Tool.app Payload/
          zip -qry RS485Tool.ipa Payload
          ls -la RS485Tool.ipa

      - name: Publish IPA to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rs485-latest
          name: CFMOTO 485 诊断工具 iOS IPA
          body: |
            未签名 IPA（自签/TrollStore）。
            - 配合 I6328A 485 蓝牙模块使用
            构建提交：${{ github.sha }}
          files: RS485Tool.ipa
          overwrite: true
          make_latest: true

      - name: Upload build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rs485-latest
          name: CFMOTO 485 诊断工具 iOS IPA
          files: xcodebuild.log
          overwrite: true